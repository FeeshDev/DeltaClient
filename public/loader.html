<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
    <title>BRClient</title>
</head>

<body>
    <img src="../build/updateSplash.png">
    <div class="main">
        <h3 id="update">Checking for updates...</h3>
        <div id="downloadBarHolder">
            <div id="downloadBar"></div>
        </div>
    </div>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            overflow: hidden;
        }

        img {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .main {
            display: flex;
            flex-direction: column;
            top: 80%;
            left: 50%;
            transform: translateX(-50%);
            position: absolute;
            z-index: 2;
            font-size: 40px;
            align-items: center;
            justify-content: center;
        }

        #update {
            font-family: 'Chewy', cursive;
            font-weight: 100;
            text-shadow:
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000;
            font-size: 40px;
            color: #EEEEEE;
            white-space: nowrap;
        }

        #downloadBarHolder {
            background-color: #0F5FC1;
            width: 400px;
            height: 20px;
            border-radius: 10px;
        }

        #downloadBar {
            overflow: hidden;
            background-color: #4B87D1;
            width: 0%;
            height: inherit;
            border-radius: 10px;
        }
    </style>
    <script>
        const updateElem = document.getElementById("update");
        const downloadBar = document.getElementById("downloadBar");

        let checking = true;
        let index = 0;
        let launchInterval;

        const changeStatus = (text) => {
            checking = false;
            updateElem.textContent = text;
        }

        setInterval(() => {
            if (!checking) return;
            updateElem.textContent = `Checking for updates${".".repeat(index % 4)}`;
            index++;
        }, 800);

        //* Ease the bar towards 95% while the game loads, the splash closes once it's ready
        const startLaunchBar = () => {
            if (launchInterval) return;
            let barPercent = 0;
            launchInterval = setInterval(() => {
                barPercent += (95 - barPercent) * 0.02;
                downloadBar.style.width = `${barPercent}%`;
            }, 20);
        }

        window.updater.on("upd-available", () => {
            changeStatus("Update available! Downloading...");
        });

        window.updater.on("upd-not-available", (version) => {
            changeStatus(`Launching client... (v${version})`);
            startLaunchBar();
        });

        window.updater.on("upd-downloaded", () => {
            changeStatus("Update downloaded! BRClient will restart soon.");
        });

        window.updater.on("upd-down-progress", (progress) => {
            changeStatus(`Downloading (${progress.transferred}/${progress.total}, ${progress.mbps}/s)`);
            downloadBar.style.width = `${progress.percent.toFixed()}%`;
        });

        window.updater.on("error", () => {
            changeStatus("Couldn't check for updates, launching anyway...");
            startLaunchBar();
        });
    </script>
</body>

</html>
